plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codekon.spb'
    compileSdk 34

    defaultConfig {
        applicationId "com.codekon.spb"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePath = project.findProperty("KEYSTORE_FILE") ?: (System.getenv("KEYSTORE_FILE") ?: "../release.keystore")
            storeFile file(keystorePath)
            storePassword project.findProperty("KEYSTORE_PASSWORD") ?: (System.getenv("KEYSTORE_PASSWORD") ?: "spb2024")
            keyAlias project.findProperty("KEY_ALIAS") ?: (System.getenv("KEY_ALIAS") ?: "codekon")
            keyPassword project.findProperty("KEY_PASSWORD") ?: (System.getenv("KEY_PASSWORD") ?: "spb2024")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
